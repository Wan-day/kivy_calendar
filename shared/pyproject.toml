[project]
name = "kivy-calendar-shared"
version = "0.0.1"
description = "Calendar logic shared by the Kivy calendar backend and Android app"
requires-python = ">=3.14"
dependencies = [
    "pydantic",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["calendar_provider"]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.14"
