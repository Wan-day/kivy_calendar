name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff
        run: ruff check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend and typecheck dependencies
        run: python -m pip install ./shared ./backend pytest httpx mypy

      - name: Run mypy
        run: mypy shared/src backend/src tests

      - name: Run mypy on the client
        run: cd client && mypy src

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend and test dependencies
        run: python -m pip install ./shared ./backend pytest httpx

      - name: Run tests
        run: pytest

  client-test:
    name: Client test
    runs-on: ubuntu-latest
    env:
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
      # Kivy needs a real GL context; the SDL dummy driver has none, so the
      # tests run under a virtual X display instead.
      SDL_VIDEODRIVER: x11
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system libraries for headless Kivy
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libegl1 libmtdev1t64

      - name: Install client and test dependencies
        run: python -m pip install ./client pytest

      - name: Run client tests
        run: cd client && xvfb-run -a -s "-screen 0 1280x1024x24" pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
