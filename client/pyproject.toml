[project]
name = "kivy-calendar-client"
version = "0.7.1"
description = "Kivy client for the self-hosted Kivy calendar backend"
requires-python = ">=3.14"
dependencies = [
    "kivy",
]

[project.scripts]
kivy-calendar = "kivy_calendar.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.14"
# The repeat rules come from shared/ (domain.recurrence), which the Android
# build bundles; screens/repeat_field.py is only loaded there.
mypy_path = ["../shared/src"]

[[tool.mypy.overrides]]
# Kivy ships no type stubs; phone_calendar only exists in the Android build
# (android/src, type-checked from android/).
module = ["kivy", "kivy.*", "phone_calendar", "phone_calendar.*"]
ignore_missing_imports = true

[tool.setuptools.package-data]
kivy_calendar = ["fonts/*.ttf", "fonts/OFL.txt"]
